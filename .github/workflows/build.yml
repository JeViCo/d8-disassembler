name: Build D8

on:
  workflow_dispatch:
    inputs:
      v8_branch:
        description: 'V8 Version / Branch'
        required: true
        default: '8.7.220.29'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '8.7.220.29' }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for V8 8.x
        if: startsWith(env.V8_BRANCH, '8.')
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Python
        if: ${{ !startsWith(env.V8_BRANCH, '8.') }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup MSVC for V8 8.x
        if: startsWith(env.V8_BRANCH, '8.')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.29'

      - name: Configure Visual Studio for V8 8.x
        if: startsWith(env.V8_BRANCH, '8.')
        # language=PowerShell
        run: |
          Write-Host "Using VS installation: $env:VSINSTALLDIR"
          Write-Host "Using VC toolset: $env:VCToolsVersion"

          "GYP_MSVS_VERSION=2019" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "GYP_MSVS_OVERRIDE_PATH=$($env:VSINSTALLDIR.TrimEnd('\'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "vs2019_install=$($env:VSINSTALLDIR.TrimEnd('\'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSVC
        if: ${{ !startsWith(env.V8_BRANCH, '8.') }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install depot_tools
        # language=PowerShell
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch V8
        # language=PowerShell
        run: |
          New-Item -ItemType Directory -Path target -Force | Out-Null
          Set-Location target

          fetch v8

          Set-Location v8
          git checkout $env:V8_BRANCH
          gclient sync -v

      - name: Patch Legacy V8 Python Toolchain
        # language=PowerShell
        run: |
          $major = [int](($env:V8_BRANCH -split '\.')[0])

          if ($major -ge 9) {
            Write-Host "V8 $env:V8_BRANCH does not require legacy Python toolchain fixes."
            exit 0
          }

          #
          # setup_toolchain.py
          #
          # Python 2 map() was eager. Python 3 map() is lazy, which causes
          # the cross-drive ValueError to escape the existing try/catch.
          #
          $setupToolchainPath = "target\v8\build\toolchain\win\setup_toolchain.py"

          if (-not (Test-Path $setupToolchainPath)) {
            throw "Legacy toolchain script not found: $setupToolchainPath"
          }

          $content = Get-Content -Path $setupToolchainPath -Raw

          $setupOld = "lib = map(os.path.relpath, lib)"
          $setupNew = "lib = list(map(os.path.relpath, lib))"

          if ($content.Contains($setupOld)) {
            $content = $content.Replace($setupOld, $setupNew)

            [System.IO.File]::WriteAllText(
              (Resolve-Path $setupToolchainPath).Path,
              $content,
              [System.Text.UTF8Encoding]::new($false)
            )

            Write-Host "Patched setup_toolchain.py map() compatibility."
          } elseif ($content.Contains($setupNew)) {
            Write-Host "setup_toolchain.py compatibility fix already present."
          } else {
            throw "Expected legacy map() expression was not found in $setupToolchainPath"
          }

          #
          # tool_wrapper.py
          #
          # Old Chromium expects subprocess output to be str, as it was on
          # Python 2. Python 3 returns bytes.
          #
          $toolWrapperPath = "target\v8\build\toolchain\win\tool_wrapper.py"

          if (-not (Test-Path $toolWrapperPath)) {
            throw "Legacy tool wrapper not found: $toolWrapperPath"
          }

          $content = Get-Content -Path $toolWrapperPath -Raw

          #
          # ASM wrapper.
          #
          $asmOld = "for line in out.splitlines():"
          $asmNew = "for line in out.decode('utf-8', errors='replace').splitlines():"

          if ($content.Contains($asmOld)) {
            $content = $content.Replace($asmOld, $asmNew)
            Write-Host "Patched assembler output decoding."
          } elseif ($content.Contains($asmNew)) {
            Write-Host "Assembler output decoding already patched."
          } else {
            throw "Expected legacy assembler output loop was not found."
          }

          #
          # Link wrapper.
          #
          # Decode each subprocess stdout line before the existing string
          # comparisons. Keeping this as a one-line replacement avoids
          # YAML/PowerShell here-string indentation problems.
          #
          $linkOld = "for line in link.stdout:"
          $linkNew = "for line in map(lambda value: value.decode('utf-8', errors='replace'), link.stdout):"

          if ($content.Contains($linkOld)) {
            $content = $content.Replace($linkOld, $linkNew)
            Write-Host "Patched linker output decoding."
          } elseif ($content.Contains($linkNew)) {
            Write-Host "Linker output decoding already patched."
          } else {
            throw "Expected legacy linker output loop was not found."
          }

          [System.IO.File]::WriteAllText(
            (Resolve-Path $toolWrapperPath).Path,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: v8-src-${{ env.V8_BRANCH }}
          path: target/v8/src
          compression-level: 9

      - name: Patch V8
        # language=PowerShell
        run: |
          ./patcher.ps1

      - name: Select Build Arguments
        id: build-args
        # language=PowerShell
        run: |
          $major = [int](($env:V8_BRANCH -split '\.')[0])

          if ($major -lt 9) {
            $argsFile = "scripts/args-legacy.gn"
          } else {
            $argsFile = "scripts/args.gn"
          }

          Write-Host "Using GN arguments: $argsFile"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "file=$argsFile"

      - name: Restore Build Cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: target/v8/out.gn/x64.release
          key: v8-build-${{ runner.os }}-${{ env.V8_BRANCH }}-${{ hashFiles('.github/workflows/build.yml', 'scripts/args*.gn', 'patcher.ps1', 'patches/**/*.psm1', 'patches/**/*.cc') }}

      - name: Build D8
        id: build
        # language=PowerShell
        run: |
          Set-Location target\v8

          $release = "out.gn\x64.release"
          New-Item -ItemType Directory -Path $release -Force | Out-Null

          $argsFile = "${{ steps.build-args.outputs.file }}"

          Write-Host "Copying $argsFile"
          Copy-Item "..\..\$argsFile" "$release\args.gn" -Force

          gn gen $release
          ninja -C $release d8

          $artifact = "d8-with-disassembler-$env:V8_BRANCH"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact=$artifact"

      - name: Save Build Cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/v8/out.gn/x64.release
          key: v8-build-${{ runner.os }}-${{ env.V8_BRANCH }}-${{ hashFiles('.github/workflows/build.yml', 'scripts/args*.gn', 'patcher.ps1', 'patches/**/*.psm1', 'patches/**/*.cc') }}

      - name: Cleanup Artifact
        # language=PowerShell
        run: |
          Set-Location target\v8\out.gn\x64.release

          Get-ChildItem

          if (Test-Path gen) {
            Remove-Item -Path gen -Recurse -Force
          }

          if (Test-Path obj) {
            Remove-Item -Path obj -Recurse -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: target/v8/out.gn/x64.release
          compression-level: 9
